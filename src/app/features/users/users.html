<div class="table-container">
   <!-- New Header Wrapper -->
    <div class="table-header">
        <mat-form-field appearance="outline" class="filter-field">
            <mat-label>Search Users</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Jane" #input>
        </mat-form-field>

        <button mat-flat-button color="primary" (click)="openAddUserDialog()">
            <mat-icon>add</mat-icon>
            Add User
        </button>
    </div>

     @if (isLoading) {
        <mat-progress-bar mode="indeterminate" color="primary"></mat-progress-bar>
    }

    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z1">  
    
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
            <td mat-cell *matCellDef="let row"> {{row.id}} </td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
            <td mat-cell *matCellDef="let row"> {{row.name}} </td>
        </ng-container>

        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
            <td mat-cell *matCellDef="let row"> {{row.email}} </td>
        </ng-container>

        <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Role </th>
            <td mat-cell *matCellDef="let row"> {{row.role}} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let row">
            <!-- Edit Button -->
            <button mat-icon-button color="primary" (click)="editUser(row)" [disableRipple]="true">
                <mat-icon>edit</mat-icon>
            </button>
            
            <!-- Delete Button -->

            <button mat-icon-button color="warn" (click)="deleteUser(row)" title="Delete User" [disableRipple]="true">
                <mat-icon>delete</mat-icon>
            </button>
        </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
    </table>
        <!-- Paginator UI -->
    <mat-paginator 
        [pageSizeOptions]="[5, 10, 20]" 
        showFirstLastButtons 
        aria-label="Select page of users">
    </mat-paginator>
</div>
