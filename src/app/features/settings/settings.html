<div class="settings-container">
  <mat-card class="settings-card">
    <mat-card-header>
      <mat-card-title>Account Settings</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="settingsForm" (ngSubmit)="onSave()" class="settings-form">
        <div class="form-row">
            <mat-form-field appearance="outline">
            <mat-label>First Name</mat-label>
            <input matInput formControlName="firstName">
            <mat-error *ngIf="settingsForm.get('firstName')?.hasError('required')">
                First name is <strong>required</strong>
            </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
            <mat-label>Last Name</mat-label>
            <input matInput formControlName="lastName">
            <mat-error *ngIf="settingsForm.get('lastName')?.hasError('required')">
                Last name is required
            </mat-error>
            </mat-form-field>
        </div>

        <mat-form-field appearance="outline">
            <mat-label>Email Address</mat-label>
            <input matInput formControlName="email" type="email">
            <mat-error *ngIf="settingsForm.get('email')?.hasError('email')">
            Please enter a <strong>valid</strong> email address
            </mat-error>
        </mat-form-field>

        <mat-divider></mat-divider>
        <h3 class="section-title">Security</h3>

        <mat-form-field appearance="outline">
          <mat-label>Current Password</mat-label>
          <input matInput formControlName="currentPassword" type="password"> 
            <mat-error *ngIf="settingsForm.get('currentPassword')?.hasError('required')">
                Password is required
            </mat-error>
        </mat-form-field>

        <button mat-flat-button color="primary" [disabled]="!settingsForm.valid" type="submit">
            Save Changes
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
