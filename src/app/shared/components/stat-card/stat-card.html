 <mat-card [class]="'stat-card ' + themeColor">
      <mat-card-header>
        <div mat-card-avatar class="icon-container">
          <mat-icon>{{ icon }}</mat-icon>
        </div>
        <mat-card-title>{{ value }}</mat-card-title>
        <mat-card-subtitle>{{ title }}</mat-card-subtitle>
      </mat-card-header>
      <!-- Optional trend indicator -->
      @if (trend) {
        <mat-card-footer class="trend-footer">
          <span [class]="trendPositive ? 'up' : 'down'">
            {{ trendPositive ? '▲' : '▼' }} {{ trend }}
          </span>
          <span class="since">since last month</span>
        </mat-card-footer>
      }
    </mat-card>
